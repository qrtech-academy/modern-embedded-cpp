# Set pipeline name.
name: CI

# Set pipeline triggers.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Define pipeline jobs.
jobs:
  # Build lecture demo code, run on latest Ubuntu runner.
  build-demos:
    name: Build lecture demo code
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build
        run: make build

  # Check code formatting, run on latest Ubuntu runner.
  format-check:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: make format-check

  # Run every lecture's test suite twice: against the reference solutions, where every test must
  # pass, and against the empty workspace a fresh clone has, where every exercise set must be
  # reported as SKIP and the always-on tests must still pass.
  test:
    name: Run the test suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test the reference solutions
        run: make test SOLUTIONS=1
      - name: Test an empty workspace
        run: make test
